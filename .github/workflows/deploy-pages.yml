name: Deploy Diablo 1 to GitHub Pages (WebAssembly)

on:
  push:
    branches:
      - testing
      - master
      - uiMejoradaWebAssembly
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-emscripten-ccache
          max-size: 1G

      - name: Configure CMake with Emscripten
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=OFF \
            -DASAN=OFF \
            -DUBSAN=OFF \
            -DTSAN=OFF \
            -DDISABLE_ZERO_TIER=ON \
            -DDISABLE_TCP=ON \
            -DDEVILUTIONX_SYSTEM_SDL_AUDIOLIB=OFF \
            -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF \
            -DDEVILUTIONX_SYSTEM_LIBFMT=OFF \
            -DDEVILUTIONX_SYSTEM_BZIP2=OFF

      - name: Build DevilutionX WebAssembly
        run: |
          cmake --build build-web --target devilutionx

      - name: Prepare GitHub Pages Distribution
        run: |
          mkdir -p dist
          cp -v build-web/devilutionx.js dist/
          cp -v build-web/devilutionx.wasm dist/
          if [ -f build-web/devilutionx.data ]; then cp -v build-web/devilutionx.data dist/; fi
          cp -v Packaging/emscripten/index.html dist/index.html
          cp -v Packaging/emscripten/file-manager.js dist/file-manager.js
          echo "Listing dist/ directory:"
          ls -la dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
