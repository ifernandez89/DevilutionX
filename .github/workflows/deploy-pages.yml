name: Deploy Diablo 1 to GitHub Pages (WebAssembly)

on:
  push:
    branches:
      - testing
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53

      - name: Install Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext cmake ninja-build genisoimage

      - name: Prebuild Emscripten Ports Cache
        run: |
          embuilder build zlib bzip2 libpng sdl2 sdl2_image sdl2_image_png || embuilder build zlib bzip2 libpng sdl2 sdl2_image

      - name: Configure CMake with Emscripten
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DASAN=OFF \
            -DUBSAN=OFF \
            -DTSAN=OFF \
            -DDISABLE_ZERO_TIER=ON \
            -DDISABLE_TCP=ON \
            -DDEVILUTIONX_SYSTEM_SDL_AUDIOLIB=OFF \
            -DDEVILUTIONX_SYSTEM_LIBSODIUM=OFF \
            -DDEVILUTIONX_SYSTEM_LIBFMT=OFF \
            -DDEVILUTIONX_SYSTEM_BZIP2=OFF

      - name: Build DevilutionX WebAssembly
        run: |
          cmake --build build-web --target devilutionx

      - name: Build Virtual PC & MiniXP Images
        run: |
          mkdir -p Packaging/minixp-wasm
          pip install pycdlib
          python3 Packaging/minixp-wasm/build_retro_tinycore.py || true
          python3 Packaging/minixp-wasm/fetch_freedoom.py || true
          python3 Packaging/minixp-wasm/build_perfect_retro_iso.py || true
          python3 tools/build_minixp_iso.py MiniXp Packaging/minixp-wasm/minixp.iso || true
          echo "Checking Packaging/minixp-wasm contents:"
          ls -la Packaging/minixp-wasm/


      - name: Prepare GitHub Pages Distribution
        run: |
          mkdir -p dist
          cp -v build-web/devilutionx.js dist/
          cp -v build-web/devilutionx.wasm dist/
          if [ -f build-web/devilutionx.data ]; then cp -v build-web/devilutionx.data dist/; fi
          cp -v Packaging/emscripten/index.html dist/index.html
          cp -v Packaging/emscripten/file-manager.js dist/file-manager.js
          if [ -f Packaging/emscripten/neural_infer.js ]; then cp -v Packaging/emscripten/neural_infer.js dist/neural_infer.js; fi
          if [ -d Packaging/emscripten/shaders ]; then
            cp -rv Packaging/emscripten/shaders dist/shaders
          fi
          if [ -d Packaging/neural_harness ]; then
            cp -rv Packaging/neural_harness dist/harness
          fi
          if [ -d Packaging/minixp-wasm ]; then
            cp -rv Packaging/minixp-wasm dist/minixp
            cp -rv Packaging/minixp-wasm dist/tinycore
          fi
          echo "Fetching official spawn.mpq (shareware) into dist/..."
          curl -L -f -s -S --retry 3 -o dist/spawn.mpq https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq || true
          echo "Listing dist/ and dist/minixp/ directory:"
          ls -la dist/
          ls -la dist/minixp/
          ls -la dist/tinycore/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
