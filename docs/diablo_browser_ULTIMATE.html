<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Diablo 1 - Browser Edition ULTIMATE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0000, #000);
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 3em;
            color: #ff6b6b;
            text-shadow: 3px 3px 6px rgba(255, 107, 107, 0.5);
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 3px 3px 6px rgba(255, 107, 107, 0.5); }
            to { text-shadow: 3px 3px 15px rgba(255, 107, 107, 0.8); }
        }
        
        .mpq-selection {
            background: rgba(255, 107, 107, 0.15);
            border: 3px solid #ff6b6b;
            border-radius: 12px;
            padding: 40px;
            max-width: 700px;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }
        
        .select-mpq-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff5252);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.3em;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .select-mpq-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        
        .mpq-status {
            margin: 20px 0;
            font-size: 1.1em;
            min-height: 25px;
            font-weight: bold;
        }
        
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .processing { color: #ffd93d; }
        
        .game-container {
            border: 3px solid #ff6b6b;
            border-radius: 12px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
            max-width: 90vw;
            max-height: 90vh;
        }
        
        canvas {
            display: block;
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            max-width: 100%;
            max-height: 70vh;
        }
        
        .loading {
            color: #ffd93d;
            font-size: 1.2em;
            margin: 20px 0;
            font-weight: bold;
        }
        
        .debug-info {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0f0;
            padding: 15px;
            margin: 15px 0;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">💀 DIABLO 1 - ULTIMATE</div>
        <div style="font-size: 1.3em; color: #ffd93d;">🌐 Browser Edition - Complete WebAssembly Fix</div>
    </div>
    
    <!-- MPQ Selection -->
    <div id="mpq-selection" class="mpq-selection">
        <div style="font-size: 1.5em; color: #ff6b6b; margin-bottom: 20px;">
            🔑 Load Your Diablo 1 Game Data
        </div>
        <div style="color: #ccc; margin-bottom: 25px; line-height: 1.5;">
            Select your <strong>diablodat.mpq</strong> file to play the complete Diablo 1 experience<br>
            <small>(File stays in your browser - never uploaded to any server)</small>
        </div>
        
        <input type="file" id="mpq-file-input" accept=".mpq" style="display: none;">
        <button id="select-mpq-btn" class="select-mpq-btn">📁 Select diablodat.mpq</button>
        
        <div id="mpq-status" class="mpq-status"></div>
    </div>
    
    <!-- Game Container -->
    <div id="game-container" class="game-container" style="display: none;">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div class="loading" id="loading">🔄 Initializing Diablo 1 Engine...</div>
        <div id="debug-info" class="debug-info"></div>
    </div>

    <script>
        // Ultimate Diablo 1 Browser Handler with complete WebAssembly support
        window.DiabloUltimateHandler = {
            mpqFile: null,
            gameStarted: false,
            
            init: function() {
                console.log('🎮 Diablo 1 Browser Edition - ULTIMATE VERSION initializing...');
                this.debugLog('Initializing ULTIMATE Diablo 1 browser engine...');
                
                const fileInput = document.getElementById('mpq-file-input');
                const selectBtn = document.getElementById('select-mpq-btn');
                
                selectBtn.onclick = () => {
                    fileInput.click();
                };
                
                fileInput.onchange = (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        this.handleMPQFile(file);
                    }
                };
                
                this.debugLog('Ultimate handler initialized successfully');
            },
            
            debugLog: function(message) {
                const debugDiv = document.getElementById('debug-info');
                const timestamp = new Date().toLocaleTimeString();
                debugDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
                debugDiv.scrollTop = debugDiv.scrollHeight;
                console.log('[DIABLO-ULTIMATE]', message);
            },
            
            handleMPQFile: function(file) {
                const statusDiv = document.getElementById('mpq-status');
                const selectBtn = document.getElementById('select-mpq-btn');
                
                this.debugLog(`Processing MPQ file: ${file.name} (${Math.round(file.size / 1024 / 1024)}MB)`);
                
                selectBtn.disabled = true;
                selectBtn.textContent = '🔄 Processing...';
                statusDiv.className = 'mpq-status processing';
                statusDiv.textContent = '🔍 Validating Diablo MPQ file...';
                
                // Validate file
                if (!this.validateMPQ(file)) {
                    this.resetButton();
                    return;
                }
                
                // Read MPQ file
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.debugLog('MPQ file read into memory successfully');
                    const arrayBuffer = e.target.result;
                    
                    // Store MPQ data
                    this.mpqFile = new Uint8Array(arrayBuffer);
                    this.debugLog(`MPQ stored in memory: ${this.mpqFile.length} bytes`);
                    
                    statusDiv.className = 'mpq-status success';
                    statusDiv.textContent = '✅ Diablo MPQ loaded successfully!';
                    selectBtn.textContent = '✅ MPQ Ready';
                    
                    // Show game container and prepare to start
                    setTimeout(() => {
                        this.prepareGameStart();
                    }, 1500);
                };
                
                reader.onerror = () => {
                    this.debugLog('MPQ file read error');
                    statusDiv.className = 'mpq-status error';
                    statusDiv.textContent = '❌ Failed to read MPQ file';
                    this.resetButton();
                };
                
                reader.readAsArrayBuffer(file);
            },
            
            validateMPQ: function(file) {
                const statusDiv = document.getElementById('mpq-status');
                
                // Check filename
                const fileName = file.name.toLowerCase();
                if (!(fileName.includes('diabdat') || fileName.includes('diablodat')) || !fileName.endsWith('.mpq')) {
                    statusDiv.className = 'mpq-status error';
                    statusDiv.textContent = '❌ Please select diablodat.mpq (or similar Diablo MPQ file)';
                    this.debugLog('Invalid filename: ' + file.name);
                    return false;
                }
                
                this.debugLog('MPQ validation passed successfully');
                return true;
            },
            
            resetButton: function() {
                const selectBtn = document.getElementById('select-mpq-btn');
                selectBtn.disabled = false;
                selectBtn.textContent = '📁 Select diablodat.mpq';
            },
            
            prepareGameStart: function() {
                this.debugLog('Preparing ULTIMATE game start sequence...');
                
                // Hide MPQ selection, show game
                document.getElementById('mpq-selection').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                
                const loadingDiv = document.getElementById('loading');
                loadingDiv.textContent = '🔧 Setting up ULTIMATE Diablo 1 WebAssembly runtime...';
                
                // Use the original Emscripten approach - let it handle everything
                this.initializeUltimateWebAssembly()
                    .then(() => {
                        this.debugLog('ULTIMATE WebAssembly environment ready');
                        loadingDiv.textContent = '🎮 Diablo 1 ready to start!';
                    })
                    .catch(error => {
                        this.debugLog(`Setup error: ${error.message}`);
                        loadingDiv.textContent = '⚠️ Setup error - Check console for details';
                    });
            },
            
            initializeUltimateWebAssembly: function() {
                return new Promise((resolve, reject) => {
                    this.debugLog('Initializing ULTIMATE WebAssembly runtime...');
                    
                    // Minimal Module configuration - let Emscripten do its thing
                    window.Module = {
                        canvas: document.getElementById('canvas'),
                        
                        print: (text) => {
                            console.log('[Diablo]', text);
                            this.debugLog(`[Game] ${text}`);
                        },
                        
                        printErr: (text) => {
                            console.error('[Diablo]', text);
                            this.debugLog(`[Error] ${text}`);
                        },
                        
                        onRuntimeInitialized: () => {
                            this.debugLog('✅ ULTIMATE Diablo runtime initialized successfully');
                            
                            // Mount MPQ file if available
                            if (this.mpqFile && window.Module.FS) {
                                try {
                                    window.Module.FS.writeFile('/diablodat.mpq', this.mpqFile);
                                    window.Module.FS.writeFile('/DIABDAT.MPQ', this.mpqFile);
                                    this.debugLog('✅ MPQ file mounted successfully');
                                } catch (error) {
                                    this.debugLog(`MPQ mount error: ${error.message}`);
                                }
                            }
                            
                            resolve();
                        },
                        
                        onAbort: (what) => {
                            this.debugLog(`❌ Runtime aborted: ${what}`);
                            reject(new Error('Runtime aborted: ' + what));
                        }
                    };
                    
                    // Load the Emscripten runtime and let it handle everything
                    this.debugLog('Loading Emscripten runtime - full automatic mode...');
                    const script = document.createElement('script');
                    script.src = 'devilutionx.js';
                    script.onload = () => {
                        this.debugLog('Emscripten runtime loaded - waiting for initialization...');
                        // onRuntimeInitialized will call resolve
                    };
                    script.onerror = () => {
                        this.debugLog('Failed to load Emscripten runtime');
                        reject(new Error('Failed to load Emscripten runtime'));
                    };
                    document.head.appendChild(script);
                });
            }
        };
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            window.DiabloUltimateHandler.init();
        });
    </script>
</body>
</html>
