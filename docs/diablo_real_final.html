<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diablo 1 - Nightmare Edition (Real WebAssembly)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0000, #330000, #1a0000);
            font-family: 'Courier New', monospace;
            color: #ff6666;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            position: relative;
            background: #000;
            border: 3px solid #ff6666;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255, 102, 102, 0.5);
            overflow: hidden;
            max-width: 100vw;
            max-height: 100vh;
        }

        #gameCanvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 102, 102, 0.8);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff6666;
        }

        .loading h2 {
            color: #ff6666;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 102, 102, 0.8);
        }

        .progress-bar {
            width: 300px;
            height: 20px;
            background: #330000;
            border: 2px solid #ff6666;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ff6666);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 102, 102, 0.5);
        }

        .status-text {
            color: #ffcccc;
            font-size: 14px;
            margin-top: 10px;
        }

        .mpq-upload {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #ff6666;
            border-radius: 8px;
            text-align: center;
            background: rgba(255, 102, 102, 0.1);
        }

        .mpq-upload input[type="file"] {
            margin: 10px 0;
            padding: 8px;
            background: #330000;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 4px;
        }

        .error {
            color: #ff3333;
            background: rgba(255, 51, 51, 0.1);
            padding: 15px;
            border: 1px solid #ff3333;
            border-radius: 5px;
            margin: 10px 0;
        }

        .success {
            color: #33ff33;
            background: rgba(51, 255, 51, 0.1);
            padding: 15px;
            border: 1px solid #33ff33;
            border-radius: 5px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .game-container {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            
            .controls {
                top: 5px;
                right: 5px;
            }
            
            .control-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="controls">
            <button class="control-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F11)">🔳 Fullscreen</button>
            <button class="control-btn" onclick="resetGame()" title="Reset Game">🔄 Reset</button>
        </div>
        
        <div id="loadingScreen" class="loading">
            <h2>🔥 Diablo 1 - Nightmare Edition 🔥</h2>
            <p>Real WebAssembly Compilation</p>
            
            <div id="mpqUpload" class="mpq-upload">
                <p><strong>Step 1:</strong> Select your DIABDAT.MPQ file</p>
                <p style="font-size: 12px; color: #ffcccc;">
                    This file contains the original Diablo 1 game data.<br>
                    It should be located in your Diablo 1 installation folder.
                </p>
                <input type="file" id="mpqFile" accept=".mpq,.MPQ" />
                <button class="control-btn" onclick="loadMPQ()">Load MPQ File</button>
            </div>
            
            <div id="gameLoading" style="display: none;">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="statusText" class="status-text">Initializing WebAssembly...</div>
            </div>
            
            <div id="messages"></div>
        </div>
        
        <canvas id="gameCanvas" width="640" height="480" style="display: none;"></canvas>
    </div>

    <script>
        let gameModule = null;
        let gameRunning = false;
        let mpqLoaded = false;

        // Show message function
        function showMessage(text, type = 'info') {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = type;
            div.textContent = text;
            messages.appendChild(div);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (div.parentNode) {
                    div.parentNode.removeChild(div);
                }
            }, 5000);
        }

        // Update progress
        function updateProgress(percent, status) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('statusText').textContent = status;
        }

        // Load MPQ file
        async function loadMPQ() {
            const fileInput = document.getElementById('mpqFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showMessage('Please select a DIABDAT.MPQ file first.', 'error');
                return;
            }
            
            if (!file.name.toLowerCase().includes('diabdat') || !file.name.toLowerCase().endsWith('.mpq')) {
                showMessage('Please select the DIABDAT.MPQ file (not other MPQ files).', 'error');
                return;
            }
            
            try {
                showMessage('Loading MPQ file...', 'info');
                document.getElementById('mpqUpload').style.display = 'none';
                document.getElementById('gameLoading').style.display = 'block';
                
                updateProgress(10, 'Reading MPQ file...');
                
                // Read the file
                const arrayBuffer = await file.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                
                updateProgress(30, 'Validating MPQ structure...');
                
                // Basic MPQ validation
                const mpqSignature = new TextDecoder().decode(uint8Array.slice(0, 4));
                if (mpqSignature !== 'MPQ\x1A' && mpqSignature !== 'MPQ\x1B') {
                    throw new Error('Invalid MPQ file format. Please select a valid DIABDAT.MPQ file.');
                }
                
                updateProgress(50, 'Storing MPQ data...');
                
                // Store MPQ data for the game
                window.diabdatMPQ = uint8Array;
                mpqLoaded = true;
                
                updateProgress(70, 'MPQ file loaded successfully!');
                showMessage('✅ DIABDAT.MPQ loaded successfully!', 'success');
                
                // Start loading the game
                setTimeout(loadGame, 1000);
                
            } catch (error) {
                console.error('MPQ loading error:', error);
                showMessage('❌ Error loading MPQ file: ' + error.message, 'error');
                document.getElementById('mpqUpload').style.display = 'block';
                document.getElementById('gameLoading').style.display = 'none';
            }
        }

        // Load the WebAssembly game
        async function loadGame() {
            if (!mpqLoaded) {
                showMessage('Please load the MPQ file first.', 'error');
                return;
            }
            
            try {
                updateProgress(80, 'Loading WebAssembly engine...');
                
                // Configure the module
                const moduleConfig = {
                    canvas: document.getElementById('gameCanvas'),
                    noInitialRun: true,
                    
                    print: function(text) {
                        console.log('Game:', text);
                    },
                    
                    printErr: function(text) {
                        console.error('Game Error:', text);
                    },
                    
                    setStatus: function(text) {
                        console.log('Status:', text);
                        if (text.includes('Preparing')) {
                            updateProgress(85, text);
                        }
                    },
                    
                    onRuntimeInitialized: function() {
                        updateProgress(95, 'Initializing game systems...');
                        
                        // Mount the MPQ file to the virtual file system
                        if (typeof FS !== 'undefined' && window.diabdatMPQ) {
                            try {
                                FS.writeFile('/diabdat.mpq', window.diabdatMPQ);
                                showMessage('✅ Game data mounted successfully!', 'success');
                            } catch (e) {
                                console.error('Failed to mount MPQ:', e);
                                showMessage('⚠️ Warning: Could not mount MPQ file', 'error');
                            }
                        }
                        
                        updateProgress(100, 'Starting Diablo 1...');
                        
                        // Hide loading screen and show game
                        setTimeout(() => {
                            document.getElementById('loadingScreen').style.display = 'none';
                            document.getElementById('gameCanvas').style.display = 'block';
                            
                            // Start the game
                            try {
                                if (gameModule.callMain) {
                                    gameModule.callMain([]);
                                } else if (gameModule._main) {
                                    gameModule._main();
                                }
                                gameRunning = true;
                                showMessage('🎮 Diablo 1 is now running!', 'success');
                            } catch (e) {
                                console.error('Failed to start game:', e);
                                showMessage('❌ Failed to start game: ' + e.message, 'error');
                            }
                        }, 1000);
                    }
                };
                
                // Load the WebAssembly module
                if (typeof DevilutionX === 'function') {
                    gameModule = await DevilutionX(moduleConfig);
                } else {
                    throw new Error('DevilutionX module not found. Please check if devilutionx_real.js loaded correctly.');
                }
                
            } catch (error) {
                console.error('Game loading error:', error);
                showMessage('❌ Error loading game: ' + error.message, 'error');
                updateProgress(0, 'Failed to load game');
            }
        }

        // Fullscreen functionality
        function toggleFullscreen() {
            const container = document.querySelector('.game-container');
            
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error('Error attempting to enable fullscreen:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Reset game
        function resetGame() {
            if (gameRunning && gameModule) {
                try {
                    // Attempt to restart the game
                    location.reload();
                } catch (e) {
                    console.error('Reset error:', e);
                    location.reload();
                }
            } else {
                location.reload();
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
            } else if (e.key === 'F5' && e.ctrlKey) {
                e.preventDefault();
                resetGame();
            }
        });

        // Handle canvas resize for fullscreen
        function resizeCanvas() {
            const canvas = document.getElementById('gameCanvas');
            const container = document.querySelector('.game-container');
            
            if (document.fullscreenElement) {
                canvas.style.width = '100vw';
                canvas.style.height = '100vh';
            } else {
                canvas.style.width = '640px';
                canvas.style.height = '480px';
            }
        }

        document.addEventListener('fullscreenchange', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        // Initialize
        console.log('🔥 Diablo 1 - Nightmare Edition (Real WebAssembly) 🔥');
        console.log('Please select your DIABDAT.MPQ file to begin.');
    </script>
    
    <!-- Load the real WebAssembly runtime -->
    <script src="devilutionx_real.js"></script>
</body>
</html>
