<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diablo 1 - Test Step 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #ff6666;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a0000, #330000, #1a0000);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flame-effect {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4em;
            color: #ff3333;
            text-shadow: 0 0 20px #ff6666, 0 0 40px #ff3333;
            animation: flicker 2s infinite alternate;
            z-index: 2;
        }

        @keyframes flicker {
            0% { opacity: 0.8; text-shadow: 0 0 20px #ff6666, 0 0 40px #ff3333; }
            100% { opacity: 1; text-shadow: 0 0 30px #ff6666, 0 0 60px #ff3333, 0 0 80px #ff0000; }
        }

        .mpq-loader {
            position: relative;
            z-index: 3;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            border: 3px solid #ff6666;
            box-shadow: 0 0 30px rgba(255, 102, 102, 0.5);
            max-width: 500px;
        }

        .mpq-loader h2 {
            color: #ff6666;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 102, 102, 0.8);
        }

        .file-input-container {
            margin: 30px 0;
            padding: 20px;
            border: 2px dashed #ff6666;
            border-radius: 8px;
            background: rgba(255, 102, 102, 0.1);
        }

        .file-input-container input[type="file"] {
            width: 100%;
            padding: 15px;
            background: #330000;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 4px;
            font-size: 16px;
            margin: 10px 0;
        }

        .load-btn {
            background: linear-gradient(45deg, #ff3333, #ff6666);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .load-btn:hover {
            background: linear-gradient(45deg, #ff6666, #ff9999);
            transform: scale(1.05);
        }

        .load-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
        }

        .success { color: #33ff33; background: rgba(51, 255, 51, 0.1); border: 1px solid #33ff33; }
        .error { color: #ff3333; background: rgba(255, 51, 51, 0.1); border: 1px solid #ff3333; }
        .info { color: #ffcccc; background: rgba(255, 204, 204, 0.1); border: 1px solid #ffcccc; }

        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #666;
            border-radius: 5px;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="flame-effect">🔥</div>
        
        <div id="mpqLoader" class="mpq-loader">
            <h2>⚔️ DIABLO 1 ⚔️</h2>
            <p style="color: #ffcccc; font-size: 18px; margin-bottom: 30px;">
                Load your game data to enter the world of Sanctuary
            </p>
            
            <div class="file-input-container">
                <p><strong>🎮 Select DIABDAT.MPQ:</strong></p>
                <p style="font-size: 14px; color: #ffcccc; margin: 15px 0;">
                    📁 Original Diablo 1 game data file<br>
                    🔒 Processed securely on your device
                </p>
                <input type="file" id="mpqFile" accept=".mpq,.MPQ" />
                <button class="load-btn" id="loadBtn" onclick="testMPQOnly()" disabled>
                    🔍 Test MPQ File
                </button>
            </div>
            
            <div id="messages"></div>
            
            <div class="debug-info">
                <strong>Debug Info:</strong><br>
                <div id="debugInfo">
                    - WebAssembly files available: <span id="wasmStatus">Checking...</span><br>
                    - DevilutionX module: <span id="moduleStatus">Checking...</span><br>
                    - File system support: <span id="fsStatus">Checking...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Enable load button when file is selected
        document.getElementById('mpqFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const loadBtn = document.getElementById('loadBtn');
            
            if (file) {
                loadBtn.disabled = false;
                loadBtn.textContent = '🔍 Test MPQ File';
                showMessage('File selected: ' + file.name + ' (' + (file.size / 1024 / 1024).toFixed(2) + ' MB)', 'info');
            } else {
                loadBtn.disabled = true;
                loadBtn.textContent = '🔍 Test MPQ File';
            }
        });

        function showMessage(text, type = 'info') {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + type;
            div.textContent = text;
            messages.appendChild(div);
            
            setTimeout(() => {
                if (div.parentNode) {
                    div.parentNode.removeChild(div);
                }
            }, 8000);
        }

        function validateMPQFile(uint8Array) {
            const mpqSignature = new TextDecoder().decode(uint8Array.slice(0, 4));
            if (mpqSignature !== 'MPQ\x1A' && mpqSignature !== 'MPQ\x1B') {
                throw new Error('Invalid MPQ file format. Please select a valid DIABDAT.MPQ file.');
            }
            
            if (uint8Array.length < 100 * 1024 * 1024) {
                throw new Error('File too small to be DIABDAT.MPQ. Please select the correct file.');
            }
            
            return true;
        }

        async function testMPQOnly() {
            const fileInput = document.getElementById('mpqFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showMessage('Please select a DIABDAT.MPQ file first.', 'error');
                return;
            }
            
            const fileName = file.name.toLowerCase();
            if (!fileName.includes('diabdat') || !fileName.endsWith('.mpq')) {
                showMessage('❌ Please select the DIABDAT.MPQ file (not other MPQ files).', 'error');
                return;
            }
            
            try {
                showMessage('🔍 Testing MPQ file...', 'info');
                
                const arrayBuffer = await file.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                
                validateMPQFile(uint8Array);
                
                window.diabdatMPQ = uint8Array;
                
                showMessage('✅ DIABDAT.MPQ validated successfully!', 'success');
                showMessage('✅ File size: ' + (uint8Array.length / 1024 / 1024).toFixed(2) + ' MB', 'success');
                showMessage('✅ MPQ signature: Valid', 'success');
                showMessage('🎮 MPQ file is ready for game loading!', 'success');
                
                // Change button to next step
                document.getElementById('loadBtn').textContent = '🚀 Ready for WebAssembly Test';
                document.getElementById('loadBtn').onclick = function() {
                    showMessage('MPQ is ready! Next step would be WebAssembly loading.', 'info');
                };
                
            } catch (error) {
                console.error('MPQ validation error:', error);
                showMessage('❌ Error: ' + error.message, 'error');
            }
        }

        // Check system capabilities
        function checkSystemCapabilities() {
            // Check WebAssembly support
            const wasmSupported = typeof WebAssembly === 'object';
            document.getElementById('wasmStatus').textContent = wasmSupported ? '✅ Supported' : '❌ Not supported';
            
            // Check if files exist
            fetch('devilutionx_real.wasm')
                .then(response => {
                    if (response.ok) {
                        document.getElementById('wasmStatus').textContent += ' (WASM file found)';
                    } else {
                        document.getElementById('wasmStatus').textContent += ' (WASM file missing)';
                    }
                })
                .catch(() => {
                    document.getElementById('wasmStatus').textContent += ' (WASM file missing)';
                });
            
            // Check DevilutionX module
            setTimeout(() => {
                if (typeof DevilutionX === 'function') {
                    document.getElementById('moduleStatus').textContent = '✅ Loaded';
                } else {
                    document.getElementById('moduleStatus').textContent = '❌ Not loaded';
                }
            }, 1000);
            
            // Check File System API
            const fsSupported = typeof FileReader === 'function';
            document.getElementById('fsStatus').textContent = fsSupported ? '✅ Supported' : '❌ Not supported';
        }

        // Initialize
        checkSystemCapabilities();
        console.log('🔥 Diablo 1 - Step 1 Test Ready 🔥');
        console.log('This version only tests MPQ file validation.');
    </script>
    
    <!-- Try to load the WebAssembly runtime (but don't depend on it) -->
    <script src="devilutionx_real.js" onerror="console.log('WebAssembly runtime not loaded')"></script>
</body>
</html>
